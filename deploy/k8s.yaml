apiVersion: apps/v1
kind: Deployment
metadata: { name: canarynet, labels: { app: canarynet } }
spec:
  replicas: 1
  selector: { matchLabels: { app: canarynet } }
  template:
    metadata: { labels: { app: canarynet } }
    spec:
      containers:
        - name: canarynet
          image: ghcr.io/cognis-digital/canarynet:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: canarynet }
spec:
  selector: { app: canarynet }
  ports: [{ port: 80, targetPort: 8000 }]
